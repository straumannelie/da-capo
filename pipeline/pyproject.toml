[project]
name = "da-capo-pipeline"
version = "0.1.0"
description = "Construit les données de référence de Da capo à partir d'Open Opus, Wikidata et Wikipédia."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
]

[project.scripts]
da-capo-import = "da_capo_pipeline.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.0",
    "pytest>=9.0",
    "ruff>=0.15",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RET", "PTH", "RUF", "PL", "TRY"]
ignore = ["PLR2004", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
